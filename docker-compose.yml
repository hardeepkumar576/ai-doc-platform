version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: aidocs-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aidocs-net

  redis:
    image: redis:7-alpine
    container_name: aidocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - aidocs-net

  backend:
    build: ./backend
    container_name: aidocs-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}   # .env se aayega
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - mongo
      - redis
    networks:
      - aidocs-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: aidocs-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - aidocs-net

volumes:
  mongo_data:

networks:
  aidocs-net:
    driver: bridge